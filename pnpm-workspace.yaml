packages:
  - site

overrides:
  # Keep `vite` (peer/type-only in this workspace) on the same instance as Vite+
  # so there is never a split Vite copy.
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  # Nuxt 4.5+ runs on unhead v3. Keep one copy on the release that fixed the
  # Cloudflare preset build break (nuxt/nuxt#35670).
  unhead: '>=3.4.3'

peerDependencyRules:
  allowedVersions:
    # vite-plus-core satisfies vitest's `vite` peer (it IS the Vite 8 fork).
    vite: '*'

allowBuilds:
  '@parcel/watcher': false
  esbuild: true
  sharp: false
  unrs-resolver: true
  vue-demi: false
  workerd: true
